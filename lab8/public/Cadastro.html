<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/formulario.css">
  <title>Cadastro</title>
</head>
<body>

  <main class="caixa">
    <h1>Criar conta</h1>
    <p class="sub">Preencha seus dados para se cadastrar.</p>

    <form action="/cadastra" method="POST">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="4" required>

      <button type="submit">Criar conta</button>
    </form>

    <p class="troca">Já tem conta? <a href="/login">Entrar</a></p>
    <a class="voltar" href="/Projects.html">Voltar aos projetos</a>
  </main>

</body>
</html>
